services:
  db:
    image: postgres:17
    container_name: nhl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nhl_user
      POSTGRES_PASSWORD: nhl_password
      POSTGRES_DB: nhl_hub
    ports:
      - "127.0.0.1:5444:5432"
    volumes:
      - nhl_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nhl_user -d nhl_hub"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  nhl_db_data:
